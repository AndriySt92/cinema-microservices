
services:
  gateway-service:
    container_name: gateway-service
    image: cinema-microservices/gateway-service:dev
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    env_file:
      - .env.production.local
    ports:
      - '4000:4000'
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - cinema-microservices

networks:
  cinema-microservices:
    external: true
